[project]
name = "research-intelligence-agent"
version = "0.1.0"
description = "Evidence-first AI research and due-diligence agent: source-grounded research with deterministic citation verification."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Retrieval deps land in M3; kept separate so M0-M2 installs stay small and fast.
retrieval = [
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4",
    "trafilatura>=1.12",
]
# pgvector backend is used by the deployed instance only (ADR-004).
postgres = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]
mcp = [
    "fastmcp>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "ASYNC",    # flake8-async
    "S",        # flake8-bandit (security)
    "C4",       # flake8-comprehensions
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "PTH",      # flake8-use-pathlib
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert (S101) and hardcoded throwaway values (S105/S106).
"tests/**" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------------------
# Types — strict on application code
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["app"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without bundled type information.
module = ["sqlite_vec.*", "fastembed.*", "trafilatura.*", "fastmcp.*", "pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "live: requires ANTHROPIC_API_KEY and makes real, billable API calls (deselected by default)",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
# Coverage gate is raised milestone by milestone; see docs/architecture.md.
# M0 baseline is the floor, not the target.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
