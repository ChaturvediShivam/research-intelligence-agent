# Render blueprint. Builds the repository's existing Dockerfile; no separate
# build pipeline and no managed database, because the service's default
# vector backend is SQLite inside the container.
#
# NOT YET DEPLOYED. This file is deployment-ready configuration, not evidence
# of a running service — see docs/deployment.md for what is and is not
# verified.
services:
  - type: web
    name: research-intelligence-agent
    # `docker` builds the repository's Dockerfile. NOT `image`, which means
    # "pull a prebuilt image from a registry", requires an `image:` block and
    # ignores dockerfilePath entirely — a blueprint that mixed the two would
    # be rejected before anything was built.
    runtime: docker

    # Legacy alias for 0.5c-512mb (0.5 CPU / 512 MB), still accepted by
    # Render. Re-measured in a 512 MB container after F-019, because the
    # earlier figure here (221 MB peak) was taken embedding a trivially small
    # batch and was not representative of a real run:
    #
    #   86 MB   interpreter and imports
    #  237 MB   ONNX session loaded
    #  351 MB   peak through the real stage 4, 1000 chunks, batch size 4
    #
    # The earlier default batch size of 256 OOM-killed this plan on every
    # real run, and also OOM-killed a 1 GB ceiling. Peak is now flat in chunk
    # count; see DEFAULT_BATCH_SIZE in app/retrieval/embeddings.py.
    plan: starter
    region: oregon

    # Render builds the Dockerfile at the repository root and injects PORT,
    # which the container's CMD binds. No startCommand/dockerCommand here on
    # purpose: either would override that CMD and with it the $PORT binding.
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Liveness only. /ready reports whether a key is configured and would
    # keep the instance out of service for an operator problem rather than a
    # process one.
    healthCheckPath: /health

    envVars:
      # The only secret. sync:false means Render prompts for it rather than
      # reading it from this file, so it is never committed.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Contact address sec.gov requires automated clients to declare, or it
      # returns 403. sync:false because it is a real address, not a secret
      # but not something to commit either. Unset only costs SEC access.
      - key: SEC_CONTACT_EMAIL
        sync: false

      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: INFO

      # Cost ceiling per run, enforced in app/pipeline/orchestrator.py. Set
      # explicitly here rather than relying on the default, because the
      # default is tuned for local work.
      - key: MAX_COST_USD_PER_RUN
        value: "1.0"
      - key: MAX_SOURCES_PER_RUN
        value: "8"

      # Chunks per ONNX forward pass — a memory bound tied to the plan above,
      # not a throughput setting. Set explicitly so that raising the instance
      # size is a visible, deliberate pair of edits rather than a silent
      # inheritance of whatever the code default happens to be.
      - key: EMBEDDING_BATCH_SIZE
        value: "4"

      # Put the fastembed model cache on the persistent disk. Without this
      # fastembed falls back to tempfile.gettempdir(), so the model was
      # re-downloaded from the HF Hub on every cold start — which the disk
      # comment below already claimed was not happening. A download inside
      # stage 4 also makes the stage fail when the Hub is unreachable.
      - key: FASTEMBED_CACHE_PATH
        value: /app/data/fastembed

    # SQLite and the embedding model cache live on disk. The run database is
    # the reason this is a disk and not ephemeral storage: a research run
    # costs real money, and losing one to a restart loses that spend.
    # FASTEMBED_CACHE_PATH above points the model cache here too, so a cold
    # start no longer re-downloads it.
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
